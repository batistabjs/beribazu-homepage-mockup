<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Centro de Treinamento — Grupo Beribazu">
  <title>Centro de Treinamento — Grupo Beribazu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header" role="banner">
  <div class="header-inner">
    <a href="../index.html" class="logo" aria-label="Grupo Beribazu — página inicial">
      <img src="../images/beribazu_logo.png" alt="Logo Grupo Beribazu" class="logo-emblema">
      <div class="logo-texto">
        <span class="logo-nome">Capoeira Beribazu</span>
        <span class="logo-slogan">Desde 1972</span>
      </div>
    </a>
    <nav class="nav-principal" id="nav-principal" aria-label="Menu principal">
      <ul>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#mundo">Beribazu pelo Mundo</a></li>
        <li><a href="#eventos">Eventos</a></li>
        <li><a href="#contato" class="nav-cta">Contato</a></li>
      </ul>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- HERO DO CENTRO -->
<section class="centro-hero" id="centro-hero" aria-label="Informações do centro">
  <!-- Preenchido via JS -->
  <div class="centro-hero-inner" style="min-height: 200px; align-items: center; justify-content: center;">
    <p style="color: rgba(255,255,255,0.5);">Carregando...</p>
  </div>
</section>

<!-- CORPO DA PÁGINA DO CENTRO -->
<main class="pagina-centro" id="pagina-centro-conteudo">
  <div class="centro-body">

    <!-- Informações + Contato -->
    <div id="centro-info">
      <!-- Preenchido via JS -->
    </div>

    <!-- Galeria de Alunos -->
    <section id="galeria-alunos" aria-label="Galeria de alunos do centro">

      <h2 class="galeria-alunos-titulo">
        👥 Nossos Alunos
      </h2>

      <!-- Filtros por corda -->
      <div class="galeria-filtros" role="toolbar" aria-label="Filtrar alunos por graduação">
        <!-- Preenchido via JS -->
      </div>

      <!-- Grid de alunos -->
      <div class="alunos-grid" id="alunos-grid" aria-live="polite">
        <!-- Preenchido via JS -->
      </div>

    </section>

    <!-- Botão Voltar -->
    <div style="text-align: center; margin-top: 3rem;">
      <button onclick="history.back()" class="btn btn-primario">
        ← Voltar aos resultados
      </button>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer" role="contentinfo">
  <div class="footer-inner">
    <div class="footer-bottom" style="padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
      <p>© 2025 Grupo Beribazu — Arte-Luta desde 1972.</p>
      <a href="../index.html" style="color: var(--dourado);">← Voltar ao início</a>
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
</body>
</html>
