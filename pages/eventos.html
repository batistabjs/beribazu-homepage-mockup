<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todos os eventos do Grupo Beribazu — Batizados, seminários, rodas abertas e mais.">
  <title>Eventos — Capoeira Beribazu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header" role="banner">
  <div class="header-inner">
    <a href="../index.html" class="logo" aria-label="Capoeira Beribazu">
      <img src="../images/beribazu_logo.png" alt="Logo Capoeira Beribazu" class="logo-emblema">
      <div class="logo-texto">
        <span class="logo-nome">Capoeira Beribazu</span>
        <span class="logo-slogan">Desde 1972</span>
      </div>
    </a>
    <nav class="nav-principal" id="nav-principal" aria-label="Menu principal">
      <ul>
        <li><a href="../index.html#sobre">Sobre</a></li>
        <li><a href="../index.html#beribazu-pelo-mundo">Beribazu pelo Mundo</a></li>
        <li><a href="eventos.html" style="color:var(--vermelho-claro);">Eventos</a></li>
        <li><a href="../index.html#contato" class="nav-cta">Contato</a></li>
      </ul>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-principal">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- PAGE HEADER -->
<section class="resultados-header" aria-label="Todos os eventos">
  <nav class="breadcrumb" aria-label="Navegação estrutural">
    <a href="../index.html">Home</a>
    <span>›</span>
    <span aria-current="page">Eventos</span>
  </nav>
  <h1>Agenda de Eventos</h1>
</section>

<!-- CORPO -->
<main style="padding-top: 72px; background: var(--branco);">
  <div style="max-width: 1280px; margin: 0 auto; padding: 4rem 2rem;">

    <!-- Filtros por tipo -->
    <div class="galeria-filtros" role="toolbar" aria-label="Filtrar por tipo de evento" style="margin-bottom: 3rem;">
      <button class="filtro-btn evento-filtro-btn ativo" data-tipo="todos">Todos</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Batizado">Batizado</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Seminário">Seminário</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Workshop">Workshop</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Roda Aberta">Roda Aberta</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Encontro">Encontro</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Competição">Competição</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Intercâmbio">Intercâmbio</button>
      <button class="filtro-btn evento-filtro-btn" data-tipo="Confraternização">Confraternização</button>
    </div>

    <!-- Grid de eventos -->
    <div class="eventos-grid" id="todos-eventos-grid" aria-live="polite">
      <!-- Preenchido via JS -->
    </div>

    <!-- Voltar -->
    <div style="text-align: center; margin-top: 4rem;">
      <a href="../index.html" class="btn btn-primario">← Voltar ao início</a>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer" role="contentinfo">
  <div class="footer-inner">
    <div class="footer-bottom" style="padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
      <p>© 2025 Capoeira Beribazu — Arte-Luta desde 1972.</p>
      <a href="../index.html" style="color: var(--vermelho-claro);">← Voltar ao início</a>
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
</body>
</html>
